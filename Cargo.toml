[package]
name = "dd-rs"
version = "0.1.1"
edition = "2021"
description = "A safe, modern Rust+C alternative to dd — data duplication, conversion, and transformation tool"
license = "MIT OR Apache-2.0"
authors = ["0xwi11iam"]
repository = "https://github.com/0xwi11iam/dd-rs"
homepage = "https://github.com/0xwi11iam/dd-rs"
keywords = ["dd", "data", "copy", "disk", "safety"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"
build = "build.rs"

[[bin]]
name = "dd-rs"
path = "src/main.rs"

[lib]
name = "dd_rs"
path = "src/lib.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive", "wrap_help"] }

# Error handling
thiserror = "2"

# Signal handling
signal-hook = "0.3"

# C foreign function interface
libc = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Progress bars
indicatif = "0.17"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
criterion = "0.5"

[features]
default = []

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
