[package]
name = "dd-rs"
version = "0.1.0"
edition = "2021"
description = "A safe, modern Rust+C alternative to dd — data duplication, conversion, and transformation tool"
license = "MIT OR Apache-2.0"
authors = ["dd-rs Contributors"]
build = "build.rs"

[[bin]]
name = "dd-rs"
path = "src/main.rs"

[lib]
name = "dd_rs"
path = "src/lib.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive", "wrap_help"] }

# Better error handling
thiserror = "2"
anyhow = "1"

# Progress indicators
indicatif = "0.17"

# Async runtime for potential parallel I/O
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"], optional = true }

# Byte-level operations
bytes = "1"

# Signal handling
signal-hook = "0.3"

# Terminal interaction
atty = "0.2"

# Memory mapping for large files
memmap2 = "0.9"

# C foreign function interface
libc = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
criterion = "0.5"

[features]
default = []
async-io = ["tokio"]
direct-io = []

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
